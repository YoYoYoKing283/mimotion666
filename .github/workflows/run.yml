name: 刷步数

on:
  schedule:
    - cron: '5 2,4,6,8,12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # =========增加job级环境变量=========
    env:
      SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }}

      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y

      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: 开始
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install -e .
          python3 main.py

      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          if [[ -n "$(git status --porcelain)" ]]; then
            git commit -m "persist tokens trigger by ${{ github.event_name }}"
            git push origin master
          else
            echo "✅ 无文件变更，跳过git提交"
          fi

      - name: Server酱微信推送结果
        if: env.SERVERCHAN_KEY != ''
        run: |
          curl -s -X POST "https://sctapi.ftqq.com/${{ env.SERVERCHAN_KEY }}.send" \
          -d "title=小米步数任务通知" \
          -d "desp=任务状态：${{ job.status }}\n工作流：${{ github.workflow }}\n触发方式：${{ github.event_name }}"
